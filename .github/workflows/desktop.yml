name: Desktop CI

on:
  push:
    paths-ignore:
      - '**.md'

  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # SDL needs these to build its X11/Wayland video backends.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxss-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev \
            libgl1-mesa-dev libasound2-dev libpulse-dev

      - name: Configure
        run: cmake -S desktop -B build/desktop -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/desktop --config Release --target pvztv_player --parallel
